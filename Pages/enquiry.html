    <main>
        <h1>Enquiry</h1>

        <!--Form for Enquiry-->
        <form action="" method="post">
            <section>
                <table>
                    <tr>
                        <td width="100">Name</td>
                        <td><Input id="inpName" type="text" name="name" placeholder="Enter your name" required></Input></td>
                    </tr>
                    <tr>
                        <td width="100">Email</td>
                        <td><Input id="inpEmail" type="email" name="email" placeholder="Enter your emai" required></Input></td>
                    </tr>
                    <tr>
                        <td width="100">Phone Number</td>
                        <td><Input id="inpNumber" type="text" name="number" placeholder="Enter your contact number"></Input></td>
                    </tr>
                </table>

                <!-- Submit Button--> 
                <input id="btnSubmit" type="submit" name="Button" value="Submit!">
            </section>
            
        
        </form>
    </main>
