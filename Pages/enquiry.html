<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="karate, shotokan, warrior, dojo, 
        warriors, japanese karate, japan karate, self defense">
    <title>You Have an Enquiry? - Shotokan Warriors</title>
</head>

<link rel="stylesheet" href="../CSS/styles.css">

<!--Main Body-->
<body>
    <!--Header-->
    <Header>
        <img src="../Assets/Logo.png" alt="Shotokan Warriors Logo" width="150">

        <!--Website navigation-->
        <nav>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="class.html">Class Schedules</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </Header>

    <main>
        <h1>Enquiry</h1>

        <!--Form for Enquiry-->
        <form id="enquiryForm">
            <section>
                <table>
                    <tr>
                        <td width="100">Name</td>
                        <td><input id="inpName" type="text" name="inpName" placeholder="Enter your name"></td>
                    </tr>
                    <tr>
                        <td width="100">Email</td>
                        <td><input id="inpEmail" type="email" name="inpEmail" placeholder="Enter your emai"></td>
                    </tr>
                    <tr>
                        <td width="100">Phone Number</td>
                        <td><input id="inpNumber" type="text" name="inpNumber" placeholder="Enter your contact number"></td>
                    </tr>
                    <tr>
                        <td width="100">Message</td>
                        <td><textarea id="inpMessage" name="inpMessage" placeholder="Enter your message" ></textarea></td>
                    </tr>
                </table>

                <!-- Submit Button--> 
                <button id="btnSubmit" onclick="handleFormSubmission('enquiryForm', 'successMessage');">Submit</button>
            </section>
        </form>
        <div class="message" id="successMessage">
            Your enquiry message has been sent!
        </div>
    </main>
    
    <!--Footer-->
    <footer>
        <h4>Copyright &copy; 2025 | Shotokan Warriors</h4>
        <h4 id="date"></h4>
    </footer>

    <script src="../JavaScript/javascript.js"></script>
    
</body>
</html>
